[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-growth-workbench"
version = "0.1.0"
description = "A rule-first, human-reviewed reference engine for governed growth workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Blueprint Lab" }]
dependencies = ["jsonschema>=4.22,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/agent-blueprint-lab/governed-growth-workbench-blueprint"
Issues = "https://github.com/agent-blueprint-lab/governed-growth-workbench-blueprint/issues"

[project.scripts]
ggw = "governed_growth_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/governed_growth_workbench/schemas" = ["schemas/*.json"]
